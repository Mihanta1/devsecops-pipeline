name: CI - Build & Push Docker image

on: 
    push:
      branches: ["main"]
    pull_request:
      branches: ["main"]

jobs:
    secrets-scan:
      runs-on: ubuntu-24.04
      permissions:
        contents: read
      steps:
        - name: Checkout du code (historique complet pour Gitleaks)
          uses: actions/checkout@v4
          with:
            fetch-depth: 0

        - name: Scanner les secrets avec Gitleaks
          uses: gitleaks/gitleaks-action@v2
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    dependency-scan:
      runs-on: ubuntu-24.04
      permissions:
        contents: read
      steps:
        - name: Checkout du code
          uses: actions/checkout@v4

        - name: Scanner les vulnérabilités des dépendances avec Trivy
          uses: aquasecurity/trivy-action@v0.36.0
          with:
            scan-type: 'fs'
            scan-ref: './app'
            severity: 'HIGH,CRITICAL'
            exit-code: '1'
            ignore-unfixed: true

    test-backend:
      runs-on: ubuntu-24.04
      permissions:
        contents: read
      services:
        postgres:
          image: postgres:16-alpine
          env:
            POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          ports:
            - 5432:5432
          options: >-
            --health-cmd pg_isready
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5

      steps:
        - name: Checkout du code
          uses: actions/checkout@v4

        - name: Set up Python 3.14
          uses: actions/setup-python@v5
          with:
            python-version: "3.14"
            cache: 'pip'

        - name: Installer les dépendances
          working-directory: ./app
          run: |
            pip install --upgrade pip
            pip install -r requirements-dev.txt

        - name: Lancer Ruff (lint)
          working-directory: ./app
          run: ruff check .

        - name: Lancer les tests Pytest avec la base
          working-directory: ./app
          env:
            DATABASE_URL: postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.POSTGRES_DB }}
          run: pytest

    build-and-push: 
      needs: [test-backend, secrets-scan, dependency-scan]
      if: github.event_name == 'push'
      runs-on: ubuntu-24.04
      permissions:
        contents: read
        packages: write
      steps:
        - name: Checkout du code
          uses: actions/checkout@v4

        - name: Connexion à GHCR
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Build & Push de l'image
          uses: docker/build-push-action@v5
          with:
            context: ./app
            push: true
            tags: |
              ghcr.io/mihanta1/devsecops-pipeline:${{ github.sha }}
              ghcr.io/mihanta1/devsecops-pipeline:latest