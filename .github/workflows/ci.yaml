name: CI - Build & Push Docker image

on: 
    push:
      branches: ["main"]

jobs:
    test-backend:
      runs-on: ubuntu-latest
      
      services:
        postgres:
          image: postgres:16-alpine
          env:
            POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
            POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
            POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          ports:
            - 5432:5432
          options: >-
            --health-cmd pg_isready
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5

      steps:
        - name: Checkout du code
          uses: actions/checkout@v4

        - name: Set up Python 3.14
          uses: actions/setup-python@v5
          with:
            python-version: "3.14"
            cache: 'pip'

        - name: Installer les dépendances
          working-directory: ./app
          run: |
            pip install --upgrade pip
            pip install -r requirements-dev.txt

        - name: Lancer Ruff (lint)
          working-directory: ./app
          run: ruff check .

        - name: Lancer les tests Pytest avec la base
          working-directory: ./app
          env:
            DATABASE_URL: postgresql://${{ secrets.POSTGRES_USER }}:${{ secrets.POSTGRES_PASSWORD }}@localhost:5432/${{ secrets.POSTGRES_DB }}
          run: pytest

    build-and-push: 
      needs: test-backend
      runs-on: ubuntu-latest
      steps:
        - name: Checkout du code
          uses: actions/checkout@v4

        - name: Connexion à GHCR
          uses: docker/login-action@v3
          with:
            registry: ghcr.io
            username: ${{ github.actor }}
            password: ${{ secrets.GITHUB_TOKEN }}

        - name: Build & Push de l'image
          uses: docker/build-push-action@v5
          with:
            context: ./app
            push: true
            tags: |
              ghcr.io/mihanta1/devsecops-pipeline:${{ github.sha }}
              ghcr.io/mihanta1/devsecops-pipeline:latest