name: CI - Build, Scan, Sign & Push

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  secrets-scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout du code (historique complet pour Gitleaks)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scanner les secrets avec Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Scanner les dépendances avec Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          scan-ref: './app'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
  iac-scan:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Scanner l'IaC avec Trivy (config)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'config'
          scan-ref: '.'
          severity: 'HIGH,CRITICAL'
          exit-code: '1'
          format: 'table'
  test-backend:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: app
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: app/requirements-dev.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint avec Ruff
        run: ruff check .

      - name: Tests avec Pytest
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/db
        run: pytest

  build-and-push:
    runs-on: ubuntu-24.04
    needs: [test-backend, secrets-scan, dependency-scan, iac-scan]
    outputs:
      digest: ${{ steps.push-step.outputs.digest }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire l'image localement (sans push)
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: false
          load: true
          tags: devsecops-pipeline:scan

      - name: Scanner l'image avec Trivy (CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: 'devsecops-pipeline:scan'
          scan-type: 'image'
          severity: 'CRITICAL'
          exit-code: '1'
          ignore-unfixed: true
          format: 'json'
          output: 'trivy-image.json'

      - name: Générer le SBOM avec Syft
        uses: anchore/sbom-action@v0
        with:
          image: devsecops-pipeline:scan
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Connexion à GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publier l'image sur GHCR
        id: push-step
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ghcr.io/mihanta1/devsecops-pipeline:latest
            ghcr.io/mihanta1/devsecops-pipeline:${{ github.sha }}

      - name: Installer Cosign
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: sigstore/cosign-installer@v3

      - name: Signer l'image par digest (keyless)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cosign sign --yes ghcr.io/mihanta1/devsecops-pipeline@${{ steps.push-step.outputs.digest }}

      - name: Archiver les rapports Trivy et SBOM
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-reports
          path: |
            trivy-image.json
            sbom.spdx.json

  deploy-cd:
    runs-on: ubuntu-24.04
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installer Cosign
        uses: sigstore/cosign-installer@v3

      - name: Vérifier la signature de l'image (keyless)
        run: |
          cosign verify \
            --certificate-identity "https://github.com/Mihanta1/devsecops-pipeline/.github/workflows/ci.yaml@refs/heads/main" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "ghcr.io/mihanta1/devsecops-pipeline@${{ needs.build-and-push.outputs.digest }}"

      - name: Créer un cluster kind éphémère
        uses: helm/kind-action@v1
        with:
          cluster_name: ci

      - name: Créer le Secret de la base
        run: |
          kubectl create secret generic db-secret \
            --from-literal=POSTGRES_USER=app \
            --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 16)" \
            --from-literal=POSTGRES_DB=tasks

      - name: Déployer avec le digest vérifié
        run: |
          sed -i "s|image: .*|image: ghcr.io/mihanta1/devsecops-pipeline@${{ needs.build-and-push.outputs.digest }}|" k8s/api.yaml
          kubectl apply -f k8s/
          kubectl rollout status deployment/db --timeout=180s
          kubectl rollout status deployment/task-api --timeout=180s

      - name: Tester /health
        run: |
          kubectl port-forward svc/task-api-service 8000:8000 &
          sleep 5
          curl -fsS http://localhost:8000/health

      - name: Diagnostic en cas d'échec
        if: failure()
        run: |
          kubectl get pods
          kubectl describe pods
          kubectl logs deployment/task-api --tail=50 || true        